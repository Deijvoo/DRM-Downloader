<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Voyo Downloader</title>
<style>
body { font: 15px system-ui, sans-serif; width: 310px; padding: 16px; color: #172332; }
h1 { font-size: 20px; margin-top: 0; }
p { line-height: 1.5; }
button { font: inherit; padding: 10px; cursor: pointer; margin: 0 4px 8px 0; }
</style>
<h1>Voyo Downloader</h1>
<p id="status" role="status" aria-live="polite">Open a Voyo episode in your usual Chrome.</p>
<button id="start">Use this Voyo tab</button>
<button id="stop">Cancel capture</button>
<p>Your tab will reload. Press Play, then click Download in the app that opens.</p>
<p>First use: run <strong>Setup-Chrome.cmd</strong> in the downloaded folder.</p>
<script src="popup.js"></script>
</html>
